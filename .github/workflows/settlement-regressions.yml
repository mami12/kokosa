name: Settlement regressions

on:
  push:
    branches: [main]
    paths:
      - "server/ledger/**"
      - "server/zizobet/**"
      - "server/match-statistics.mjs"
      - "scripts/test-*.mjs"
      - "package.json"
      - "package-lock.json"
      - "web/src/**"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/settlement-regressions.yml"
  pull_request:
    paths:
      - "server/ledger/**"
      - "server/zizobet/**"
      - "server/match-statistics.mjs"
      - "scripts/test-*.mjs"
      - "package.json"
      - "package-lock.json"
      - "web/src/**"
      - "web/package.json"
      - "web/package-lock.json"

jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:settlement-focused
      - run: npm run test:historical-settlement
      - run: npm run test:selection-market
      - run: node scripts/test-board-settings.mjs && npm run test:match-order
      - run: node scripts/test-prematch-market-catalog.mjs
      - run: node scripts/test-zizobet-all-match-history.mjs && node scripts/test-provider-timeline-retention.mjs
      - run: npm ci --prefix web
      - run: npm run build:web
      - run: npm run test:auth-refresh
      - run: npm run test:markets
      - name: Optional real FotMob fixture verification
        continue-on-error: true
        env:
          FOTMOB_LIVE_VERIFY: "true"
          FOTMOB_LIVE_VERIFY_DAYS: "7"
        run: node scripts/test-fotmob-fixture-mapping.mjs
